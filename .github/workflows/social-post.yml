name: Release next social post
# Adds the next post from social/queue.json to feed.xml every Monday and Thursday at 9 am Pacific.
# An auto-posting app (dlvr.it) reads feed.xml and posts each new item to the connected social pages.
on:
  schedule:
    - cron: "0 17 * * 1,4"
  workflow_dispatch:
permissions:
  contents: write
concurrency: social-post
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release next post
        run: python3 social/release.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml social/state.json
          git commit -m "Release next social post to feed.xml" || exit 0
          git push
