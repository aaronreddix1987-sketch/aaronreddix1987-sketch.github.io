name: Release next social post
# At the existing cadence, release at most one reviewed, never-before-released item.
# RSS publication does not verify delivery to any downstream social account.
on:
  schedule:
    - cron: "0 17 * * 1,4"
  workflow_dispatch:
permissions:
  contents: write
concurrency: social-post
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release safeguards
        run: python3 -m unittest discover -s social -p test_release.py
      - name: Release next post
        run: python3 social/release.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml social/state.json
          git commit -m "Release next social post to feed.xml" || exit 0
          # Other commits can land at the same time. Rebase and retry instead of failing.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push try $i did not go through. Pulling and trying again."
            sleep $((i*15))
            git pull --rebase origin main || { git rebase --abort; git pull --rebase -X theirs origin main; }
          done
          echo "Could not push after 5 tries"; exit 1
