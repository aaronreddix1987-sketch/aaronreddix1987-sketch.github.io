name: TTI site health check
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check live pages and every checkout link
        run: |
          FAIL=0
          BASE=https://aaronreddix1987-sketch.github.io
          check() {
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 25 "$1")
            if echo "$code" | grep -qE "^[23]"; then echo "OK   $code $1"; else echo "FAIL $code $1"; FAIL=1; fi
          }
          for p in "" services.html front-office.html case-study.html ebooks.html checklist.html app.html contact.html links.html thank-you.html whiteboard.html love-and-rehab.html sober-living/ assets/site.css assets/site.js manifest.webmanifest sw.js assets/icons/icon-192.png assets/icons/icon-512.png; do
            check "$BASE/$p"
          done
          # Every Stripe checkout link on the main sales pages must open
          links=$(for p in "" ebooks.html front-office.html services.html checklist.html links.html; do curl -sS --max-time 25 "$BASE/$p"; done | grep -oE "https://buy\.stripe\.com/[A-Za-z0-9]+" | sort -u)
          n=$(echo "$links" | grep -c . || true)
          echo "Checkout links found: $n"
          if [ "$n" -lt 40 ]; then echo "FAIL too few checkout links found"; FAIL=1; fi
          for u in $links; do check "$u"; done
          # Workbook download pages
          for p in 9bcde703c28c 4edf77a67509 1d80e4212a30 3887b712263b 9528cbc8e736 f4672d42c324 d036c293d460 13a7f2992d20 6abf0c05807b 28c88d5f65aa a49d15d0369d 4b24972250d4 3891106275d4 121e8e866a8e; do
            check "$BASE/dl/$p/"
          done
          if [ $FAIL -eq 1 ]; then echo "ONE OR MORE CHECKS FAILED"; exit 1; fi
          echo "All checks passed"
