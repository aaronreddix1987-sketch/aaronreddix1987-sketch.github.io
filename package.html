<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold2:#ffd700;--ink:#050505;--panel:#0c0c0c;--line:rgba(212,175,55,.28);--ivory:#f3ead7;--mute:#b7a68a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--ink);color:var(--ivory);line-height:1.5}
img{max-width:100%;display:block}
.cinzel{font-family:Cinzel,Georgia,serif}
.top{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111;text-align:center;padding:10px 14px;font-weight:800;font-size:13px}
.top a{color:#111}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
.brand{letter-spacing:.28em;font-size:11px;text-transform:uppercase;color:var(--gold);text-decoration:none}
nav a{color:var(--ivory);text-decoration:none;margin-left:16px;font-size:13px}
.gold-btn{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a140a;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;font-size:13px}
.ghost{display:inline-block;border:1px solid var(--line);color:var(--ivory);text-decoration:none;padding:12px 20px;border-radius:999px;font-size:13px}
.hero{min-height:88vh;display:grid;place-items:end;padding:40px 24px 48px;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.78)),url(ceo_desk.jpg) center/cover}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:clamp(40px,7vw,78px);line-height:.92;font-weight:800;margin:10px 0 16px}
.kicker{color:var(--gold);letter-spacing:.32em;font-size:11px;text-transform:uppercase}
.lede{max-width:540px;color:#efe4c8;margin-bottom:22px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
section{padding:64px 24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.num{color:var(--gold);font-size:26px}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.photo{width:100%;height:420px;object-fit:cover;object-position:top;border-radius:22px;border:1px solid var(--line)}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.book{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column}
.book h3{font-size:16px;margin:0 0 8px;font-family:Cinzel,Georgia,serif}
.book p{color:var(--mute);font-size:13px;flex:1}
.price{color:var(--gold);font-size:26px;margin:10px 0;font-family:Cinzel,Georgia,serif}
footer{padding:36px 24px;text-align:center;color:#7a6c57;font-size:12px;border-top:1px solid var(--line)}
footer a{color:var(--gold);text-decoration:none}
@media(max-width:900px){.grid4,.books,.split{grid-template-columns:1fr}.photo{height:280px}}
</style>
</head>
<body>
<div class="top">Card payment opens the files immediately · Chime $ceomrreddix</div>

  </div>
</nav>
<section class="hero">
  <div class="wrap">
    <p class="kicker">10X Recovery · Live store</p>
    <h1 class="cinzel">Action. Systems. Mindset. Freedom.</h1>
    <p class="lede">Pay by card. The book downloads. Same luxury office. No wait. No ticket.</p>
    <div class="btns">
      <a class="gold-btn" href="https://buy.stripe.com/28E28r7Af0Tt4ZXfha0ZW0x" target="_blank" rel="noopener">Complete bundle — $97</a>
      <a class="ghost" href="#library">All products</a>
    </div>
  </div>
</section>
</body>
</html>
